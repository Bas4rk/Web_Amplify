type Calendar
    @model
    @auth(rules: [{allow: owner, operations: [read, create, update, delete]}])
    @key(fields:["owner"])
{
    owner: ID!
    memo :[Memo] @connection(keyName: "memo",fields: ["owner"])
}
type Memo
    @model
    @auth(rules: [{allow: owner, operations: [read, create, update, delete]}])
    @key(name: "memo",fields:["owner"])
{
    id: ID!
    owner: ID! 
    date: DATE!
    weight: Float
    bfp: Float
    foodMemos: [FoodMemo] @connection(keyName: "food",fields: ["date", "owner"])
    traningMemos :[TraningMemo] @connection(keyName: "traning",fields: ["date", "owner"])
}
type FoodMemo
    @model
    @auth(rules: [{allow: owner, operations: [read, create, update, delete]}])
    @key(name: "food",fields:["memoDate", "owner"])
{
    owner: ID!
    memoDate: DATE!
    title: String!
    image: String
    calorele: Int
    lipid: Int
    proteins: Int
}
type TraningMemo
    @model
    @auth(rules: [{allow: owner, operations: [read, create, update, delete]}])
    @key(name: "traning",fields:["memoDate", "owner"])
{
    owner: ID!
    memoDate: DATE!
    image: String
    content: String
}